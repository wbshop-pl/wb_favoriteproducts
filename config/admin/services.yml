imports:
  - { resource: ../common.yml }
  - { resource: grid.yml }

services:
  _defaults:
    public: false
    autoconfigure: true
    autowire: true
    bind:
      $module: '@wbshop.wb_favoriteproducts.module'
      $context: '@wbshop.wb_favoriteproducts.context'
      $dbPrefix: '%database_prefix%'
      $cacheableHooksCollection: !tagged wbshop.wb_favoriteproducts.cacheable_hook
      $locales: '@=service("prestashop.adapter.legacy.context").getLanguages()'
      $favoriteListDataFactory: '@wbshop.wb_favoriteproducts.grid.data.factory.favorite_list_data_factory'
      $contextAdapter: '@prestashop.adapter.shop.context'

  _instanceof:
    WbShop\WbFavoriteProducts\Hook\AbstractCacheableDisplayHook:
      tags: [ 'wbshop.wb_favoriteproducts.cacheable_hook' ]

  WbShop\WbFavoriteProducts\:
    resource: '../../src/*'
    exclude:
      - '../../src/{DTO,Entity,Controller}'
      - '../../src/index.php'
      - '../../src/*/index.php'

  WbShop\WbFavoriteProducts\Hook\:
    public: true
    resource: '../../src/Hook/*'
    exclude:
      - '../../src/Hook/index.php'

  WbShop\WbFavoriteProducts\Provider\DateFiltersProvider:
    class: WbShop\WbFavoriteProducts\Provider\DateFiltersProvider
    public: true
